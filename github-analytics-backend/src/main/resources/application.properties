spring.application.name=github-analytics-backend
server.port=8080
github.api.token=${GITHUB_TOKEN:}

# --- PostgreSQL ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/analytics}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:analytics}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:analytics}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- Redis ---
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# --- OAuth2 (GitHub) ---
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:}
spring.security.oauth2.client.registration.github.scope=read:user,user:email

server.forward-headers-strategy=framework